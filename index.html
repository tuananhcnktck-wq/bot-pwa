<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoBot Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .title { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .row:last-child { border-bottom: none; }
        .label { color: #666; }
        .value { font-weight: 600; }
        .green { color: #4caf50; }
        .red { color: #f44336; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">🔐 CryptoBot - Test Mode</div>
            <div>Không cần mật khẩu - Chỉ để test!</div>
        </div>

        <div class="card">
            <div class="title">👋 Xin chào!</div>
            <div id="date"></div>
        </div>

        <div class="card">
            <div class="title">💰 Thu Chi Tháng Này</div>
            <div class="row">
                <span class="label">Thu nhập</span>
                <span class="value green" id="inc">0 đ</span>
            </div>
            <div class="row">
                <span class="label">Chi tiêu</span>
                <span class="value red" id="exp">0 đ</span>
            </div>
            <div class="row">
                <span class="label">Còn lại</span>
                <span class="value" id="bal">0 đ</span>
            </div>
            <div class="grid">
                <button class="btn" onclick="addExp()">💸 Ghi chi</button>
                <button class="btn" onclick="addInc()">💵 Ghi thu</button>
            </div>
        </div>

        <div class="card">
            <div class="grid">
                <button class="btn" onclick="showHistory()">📋 Lịch sử</button>
                <button class="btn" onclick="showStats()">📊 Thống kê</button>
                <button class="btn" onclick="exportData()">💾 Backup</button>
                <button class="btn" onclick="clearAll()">🗑️ Xóa hết</button>
            </div>
        </div>

        <div class="card">
            <div class="title">🐛 Debug Info</div>
            <div id="debug" style="font-size: 12px; color: #666;"></div>
        </div>
    </div>

    <script>
        let data = {
            finance: {
                income: [],
                expense: [],
                categories: {
                    income: ['Lương', 'Thưởng', 'Phụ', 'Đầu tư', 'Khác'],
                    expense: ['Ăn uống', 'Nhà', 'Xe', 'Vui', 'Mua sắm', 'Học', 'Y tế', 'Khác']
                }
            }
        };

        // Load data
        const saved = localStorage.getItem('test_data');
        if (saved) {
            try {
                data = JSON.parse(saved);
                log('✅ Đã load data từ localStorage');
            } catch (e) {
                log('❌ Lỗi load data: ' + e.message);
            }
        } else {
            log('ℹ️ Chưa có data, bắt đầu mới');
        }

        // Update UI
        update();

        function log(msg) {
            const debug = document.getElementById('debug');
            const time = new Date().toLocaleTimeString('vi-VN');
            debug.innerHTML = `[${time}] ${msg}<br>` + debug.innerHTML;
            console.log(msg);
        }

        function save() {
            try {
                localStorage.setItem('test_data', JSON.stringify(data));
                log('💾 Đã lưu data');
            } catch (e) {
                log('❌ Lỗi lưu: ' + e.message);
            }
        }

        function update() {
            const now = new Date();
            document.getElementById('date').textContent = now.toLocaleDateString('vi-VN', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const m = now.getMonth();
            const y = now.getFullYear();
            let inc = 0, exp = 0;

            data.finance.income.forEach(i => {
                const d = new Date(i.date);
                if (d.getMonth() === m && d.getFullYear() === y) {
                    inc += i.amount;
                }
            });

            data.finance.expense.forEach(e => {
                const d = new Date(e.date);
                if (d.getMonth() === m && d.getFullYear() === y) {
                    exp += e.amount;
                }
            });

            const bal = inc - exp;

            document.getElementById('inc').textContent = fmt(inc);
            document.getElementById('exp').textContent = fmt(exp);
            document.getElementById('bal').textContent = fmt(bal);
            document.getElementById('bal').className = 'value ' + (bal >= 0 ? 'green' : 'red');

            log(`📊 Cập nhật: Thu ${fmt(inc)}, Chi ${fmt(exp)}, Còn ${fmt(bal)}`);
        }

        function addExp() {
            log('🔵 Bắt đầu ghi chi...');
            const a = prompt('💸 Nhập số tiền chi (VND):');
            if (!a) { log('⚪ Hủy ghi chi'); return; }

            const amt = parseInt(a);
            if (isNaN(amt) || amt <= 0) {
                alert('❌ Số tiền không hợp lệ!');
                log('❌ Số tiền không hợp lệ: ' + a);
                return;
            }

            const cats = data.finance.categories.expense;
            const c = prompt('📂 Chọn hạng mục:\n' + cats.map((x, i) => `${i+1}. ${x}`).join('\n') + '\n\nNhập số hoặc tên:');
            if (!c) { log('⚪ Hủy chọn hạng mục'); return; }

            const n = parseInt(c);
            const cat = !isNaN(n) && n > 0 && n <= cats.length ? cats[n - 1] : c;

            const note = prompt('📝 Ghi chú (tùy chọn):') || '';

            data.finance.expense.push({
                id: Date.now(),
                amount: amt,
                category: cat,
                note: note,
                date: new Date().toISOString()
            });

            save();
            update();

            alert(`✅ Đã ghi chi tiêu:\n${fmt(amt)}\n${cat}`);
            log(`✅ Ghi chi: ${fmt(amt)} - ${cat}`);
        }

        function addInc() {
            log('🔵 Bắt đầu ghi thu...');
            const a = prompt('💵 Nhập số tiền thu (VND):');
            if (!a) { log('⚪ Hủy ghi thu'); return; }

            const amt = parseInt(a);
            if (isNaN(amt) || amt <= 0) {
                alert('❌ Số tiền không hợp lệ!');
                log('❌ Số tiền không hợp lệ: ' + a);
                return;
            }

            const cats = data.finance.categories.income;
            const c = prompt('📂 Chọn hạng mục:\n' + cats.map((x, i) => `${i+1}. ${x}`).join('\n') + '\n\nNhập số hoặc tên:');
            if (!c) { log('⚪ Hủy chọn hạng mục'); return; }

            const n = parseInt(c);
            const cat = !isNaN(n) && n > 0 && n <= cats.length ? cats[n - 1] : c;

            const note = prompt('📝 Ghi chú (tùy chọn):') || '';

            data.finance.income.push({
                id: Date.now(),
                amount: amt,
                category: cat,
                note: note,
                date: new Date().toISOString()
            });

            save();
            update();

            alert(`✅ Đã ghi thu nhập:\n${fmt(amt)}\n${cat}`);
            log(`✅ Ghi thu: ${fmt(amt)} - ${cat}`);
        }

        function showHistory() {
            const all = [
                ...data.finance.expense.map(t => ({ ...t, type: 'exp' })),
                ...data.finance.income.map(t => ({ ...t, type: 'inc' }))
            ].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (!all.length) {
                alert('📋 Chưa có giao dịch nào!');
                log('ℹ️ Lịch sử trống');
                return;
            }

            let msg = '📋 LỊCH SỬ (20 gần nhất):\n\n';
            all.slice(0, 20).forEach((t, i) => {
                const icon = t.type === 'inc' ? '💵' : '💸';
                msg += `${i + 1}. ${icon} ${t.category}\n   ${fmt(t.amount)}\n`;
                if (t.note) msg += `   ${t.note}\n`;
                msg += `   ${new Date(t.date).toLocaleDateString('vi-VN')}\n\n`;
            });

            alert(msg);
            log(`📋 Hiện lịch sử: ${all.length} giao dịch`);
        }

        function showStats() {
            const now = new Date();
            const m = now.getMonth();
            const y = now.getFullYear();

            const exps = data.finance.expense.filter(e => {
                const d = new Date(e.date);
                return d.getMonth() === m && d.getFullYear() === y;
            });

            if (!exps.length) {
                alert('📊 Chưa có dữ liệu chi tiêu tháng này!');
                log('ℹ️ Thống kê trống');
                return;
            }

            const by = {};
            let tot = 0;

            exps.forEach(e => {
                if (!by[e.category]) by[e.category] = 0;
                by[e.category] += e.amount;
                tot += e.amount;
            });

            let msg = '📊 THỐNG KÊ CHI TIÊU:\n\n';
            Object.entries(by).sort((a, b) => b[1] - a[1]).forEach(([cat, amt]) => {
                const pct = ((amt / tot) * 100).toFixed(1);
                msg += `${cat}:\n${fmt(amt)} (${pct}%)\n\n`;
            });
            msg += `TỔNG: ${fmt(tot)}`;

            alert(msg);
            log(`📊 Thống kê: ${exps.length} chi tiêu`);
        }

        function exportData() {
            const d = localStorage.getItem('test_data');
            if (!d) {
                alert('❌ Không có dữ liệu!');
                return;
            }

            const blob = new Blob([d], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cryptobot-backup-${Date.now()}.txt`;
            a.click();

            alert('💾 Đã xuất backup!');
            log('💾 Xuất backup thành công');
        }

        function clearAll() {
            if (confirm('🗑️ Xóa hết dữ liệu?')) {
                localStorage.removeItem('test_data');
                location.reload();
            }
        }

        function fmt(n) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(n);
        }

        log('🚀 App đã khởi động!');
    </script>
</body>
</html>
